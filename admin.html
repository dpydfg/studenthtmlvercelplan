<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学生信息管理系统 - 管理员</title>
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>学生信息管理系统</h1>
      <div class="header-actions">
        <span class="user-info" id="userInfo"></span>
        <button class="btn btn-secondary" onclick="logout()">退出登录</button>
      </div>
    </header>

    <div class="admin-container">
      <div class="toolbar">
        <div class="search-box">
          <input 
            type="text" 
            id="searchInput" 
            class="form-control" 
            placeholder="搜索学生（姓名、学号、班级、专业）"
            onkeyup="handleSearch(event)"
          >
          <button class="btn btn-primary" onclick="searchStudents()">搜索</button>
        </div>
        <button class="btn btn-success" onclick="showAddModal()">添加学生</button>
      </div>

      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>学号</th>
              <th>姓名</th>
              <th>性别</th>
              <th>年龄</th>
              <th>班级</th>
              <th>专业</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="studentsTableBody">
            <tr>
              <td colspan="7" class="loading">加载中...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <!-- 添加/编辑学生模态框 -->
  <div id="studentModal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">添加学生</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <form id="studentForm" class="form">
        <input type="hidden" id="studentId" name="id">
        
        <div class="form-group">
          <label for="modalUsername">用户名 <span class="required">*</span></label>
          <input type="text" id="modalUsername" name="username" class="form-control" required>
        </div>

        <div class="form-group">
          <label for="modalPassword">密码 <span class="required">*</span></label>
          <input type="password" id="modalPassword" name="password" class="form-control" minlength="6">
          <small class="form-hint">编辑时留空则不修改密码</small>
        </div>

        <div class="form-group">
          <label for="modalStudentId">学号 <span class="required">*</span></label>
          <input type="text" id="modalStudentId" name="studentId" class="form-control" required>
        </div>

        <div class="form-group">
          <label for="modalName">姓名 <span class="required">*</span></label>
          <input type="text" id="modalName" name="name" class="form-control" required>
        </div>

        <div class="form-group">
          <label for="modalGender">性别</label>
          <select id="modalGender" name="gender" class="form-control">
            <option value="">请选择</option>
            <option value="男">男</option>
            <option value="女">女</option>
          </select>
        </div>

        <div class="form-group">
          <label for="modalAge">年龄</label>
          <input type="number" id="modalAge" name="age" class="form-control" min="1" max="150">
        </div>

        <div class="form-group">
          <label for="modalClass">班级</label>
          <input type="text" id="modalClass" name="class" class="form-control">
        </div>

        <div class="form-group">
          <label for="modalMajor">专业</label>
          <input type="text" id="modalMajor" name="major" class="form-control">
        </div>

        <div id="modalErrorMessage" class="error-message" style="display: none;"></div>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/scripts/admin.js"></script>
  <script>
    // 页面加载时检查登录状态
    window.addEventListener('DOMContentLoaded', () => {
      checkAuth();
      loadStudents();
    });
  </script>
</body>
</html>
