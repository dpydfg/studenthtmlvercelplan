<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学生信息管理系统 - 我的信息</title>
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>学生信息管理系统</h1>
      <div class="header-actions">
        <span class="user-info" id="userInfo"></span>
        <button class="btn btn-secondary" onclick="logout()">退出登录</button>
      </div>
    </header>

    <div class="student-container">
      <div class="info-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h2>我的信息</h2>
          <button class="btn btn-primary" onclick="showEditModal()" id="editBtn" style="display: none;">编辑信息</button>
        </div>
        <div id="studentInfo" class="info-content">
          <div class="loading">加载中...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 编辑信息模态框 -->
  <div id="editModal" class="modal" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h2>编辑我的信息</h2>
        <button class="modal-close" onclick="closeEditModal()">&times;</button>
      </div>
      <form id="editForm" class="form">
        <div class="form-group">
          <label for="editName">姓名 <span class="required">*</span></label>
          <input type="text" id="editName" name="name" class="form-control" required>
        </div>

        <div class="form-group">
          <label for="editGender">性别</label>
          <select id="editGender" name="gender" class="form-control">
            <option value="">请选择</option>
            <option value="男">男</option>
            <option value="女">女</option>
          </select>
        </div>

        <div class="form-group">
          <label for="editAge">年龄</label>
          <input type="number" id="editAge" name="age" class="form-control" min="1" max="150">
        </div>

        <div class="form-group">
          <label for="editClass">班级</label>
          <input type="text" id="editClass" name="class" class="form-control">
        </div>

        <div class="form-group">
          <label for="editMajor">专业</label>
          <input type="text" id="editMajor" name="major" class="form-control">
        </div>

        <div class="form-group">
          <label for="editPassword">修改密码</label>
          <input type="password" id="editPassword" name="password" class="form-control" minlength="6">
          <small class="form-hint">留空则不修改密码</small>
        </div>

        <div id="editErrorMessage" class="error-message" style="display: none;"></div>

        <div class="form-actions">
          <button type="button" class="btn btn-secondary" onclick="closeEditModal()">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/scripts/student.js"></script>
  <script>
    // 页面加载时检查登录状态并加载信息
    window.addEventListener('DOMContentLoaded', () => {
      checkAuth();
      loadStudentInfo();
    });
  </script>
</body>
</html>
