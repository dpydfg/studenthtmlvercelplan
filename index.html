<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学生信息管理系统 - 登录</title>
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <div class="container">
    <div class="login-container">
      <div class="login-card">
        <h1 class="title">学生信息管理系统</h1>
        <p class="subtitle">请选择登录类型并输入凭据</p>
        
        <form id="loginForm" class="form">
          <div class="form-group">
            <label for="userType">用户类型</label>
            <select id="userType" name="userType" class="form-control" required>
              <option value="">请选择</option>
              <option value="admin">管理员</option>
              <option value="student">学生</option>
            </select>
          </div>

          <div class="form-group">
            <label for="username">用户名</label>
            <input 
              type="text" 
              id="username" 
              name="username" 
              class="form-control" 
              placeholder="请输入用户名"
              required
              autocomplete="username"
            >
          </div>

          <div class="form-group">
            <label for="password">密码</label>
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-control" 
              placeholder="请输入密码"
              required
              autocomplete="current-password"
            >
          </div>

          <div id="errorMessage" class="error-message" style="display: none;"></div>

          <button type="submit" class="btn btn-primary btn-block">
            <span id="loginBtnText">登录</span>
            <span id="loginBtnSpinner" class="spinner" style="display: none;"></span>
          </button>
        </form>

        <div class="form-footer">
          <p>还没有账号？<a href="/register.html">学生注册</a></p>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/scripts/auth.js"></script>
  <script>
    // 登录表单处理
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const userType = document.getElementById('userType').value;
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMessage = document.getElementById('errorMessage');
      const loginBtnText = document.getElementById('loginBtnText');
      const loginBtnSpinner = document.getElementById('loginBtnSpinner');
      const submitBtn = e.target.querySelector('button[type="submit"]');

      // 隐藏错误信息
      errorMessage.style.display = 'none';
      
      // 显示加载状态
      submitBtn.disabled = true;
      loginBtnText.style.display = 'none';
      loginBtnSpinner.style.display = 'inline-block';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json; charset=utf-8',
          },
          body: JSON.stringify({ username, password, userType }),
        });

        const data = await response.json();

        if (data.success) {
          // 保存token和用户信息
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          
          // 根据用户类型跳转
          if (data.user.userType === 'admin') {
            window.location.href = '/admin.html';
          } else {
            window.location.href = '/student.html';
          }
        } else {
          // 显示错误信息
          errorMessage.textContent = data.message || '登录失败，请检查用户名和密码';
          errorMessage.style.display = 'block';
        }
      } catch (error) {
        console.error('登录错误:', error);
        errorMessage.textContent = '网络错误: ' + (error.message || '请稍后重试');
        errorMessage.style.display = 'block';
      } finally {
        // 恢复按钮状态
        submitBtn.disabled = false;
        loginBtnText.style.display = 'inline';
        loginBtnSpinner.style.display = 'none';
      }
    });

    // 检查是否已登录
    const token = localStorage.getItem('token');
    const userStr = localStorage.getItem('user');
    if (token && userStr) {
      try {
        const user = JSON.parse(userStr);
        if (user.userType === 'admin') {
          window.location.href = '/admin.html';
        } else {
          window.location.href = '/student.html';
        }
      } catch (e) {
        // 忽略解析错误
      }
    }
  </script>
</body>
</html>
